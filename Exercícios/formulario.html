<!DOCTYPE html>
<html lang = "pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página em HTML</title>
</head>
<body>
    <!-- Cabeçalho -->
<header>
    <h1> Estão abertas as inscrições para meu time no Fifa! </h1>
</header>
<main>
        <!-- Formularios  -->
     <section>
            <h2>Formulario de aceitação para o time!</h2>
 
            <form>
                <div>
                <label for="nome">NOME:</label>
                <input type="text" id="nome" placeholder="SEU NOME AQUI">
                </div>

                 <br>

                <div>

                <label for="email">EMAIL PARA CONTATO:</label>
                <input type="email" id="email">
                </div>
 
                <br>

                
                <div>
                    <label for="anexo">Mande um print de seu ranking no fifa</label>
                    <input type="file" id="anexo">
                </div>
  
 
                <br>

                <div>
                <label for="mensagem">Por que deveríamos lhe aceitar no time?</label>
                <textarea id="mensagem" placeholder="motivo" rows="3" cols="30"></textarea>
                </div>
 
                <br>

                <div>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" min="10" max="20">
                </div>
 
                <br>

                <div>
                    <label for="cor">cor favorita</label>
                    <input type="color" id="cor">
                </div>
 
                <br>
                
                <div>
                <label for="senha">SENHA DO CARTÃO DE CRÉDITO:</label>
                <input type="password" id="senha">
                </div>

                <br>

                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>

            </form>
         </section>
      <h1>
        Menu inicial
    </h1>
    <a href="index.html">
        <button>Menu Inicial</button>
    </a>
    </main>
 
     <!-- Rodape -->
   <footer>
    <p>
       &copy; Todos os direitos reservados
    </p>
 
   </footer>
 
</body>
</html>
