<!DOCTYPE html>
<html lang = "pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página em HTML</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <!-- Cabeçalho -->
<header>
    <h1> Minha primeira página web em HTML </h1>
     <a href="./sobremim.html">
        SOBRE
    </a>
 
</header>
 
     <!--Conteudo principal -->
    <main>
        <!-- Lista orderana e desordenada -->
         <section>

            <h2> Seção de listas: </h2>
            <h3> Lista Ordenada </h3>
            <ol>
                <li>Rio de Janeiro</li>
            </ol>
            <h3> Lista Nao Ordenada</h3>
            <ul>
                <li>Batata</li>
            </ul>
         </section>
        <!-- Ibagens e vídeos -->
         <section>
        <h2> Seção de imagens e videos </h2>
        <img width="500" src="./imgs/dog.jpg" alt="Cachorro na praia">
     
        <iframe width="560" height="315" src="https://www.youtube.com/embed/32pHo_yc3Gg?si=WdCigFAXPZxM_iHs" 
        title="YouTube video player" frameborder="0"
         allow="accelerometer; autoplay; 
         clipboard-write; encrypted-media; gyroscope;
          picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
         </section>
        <!-- Formularios  -->
     <section class="last">
            <h2>Formulario simples</h2>
 
            <form id = "formulario">
                <div>
                <label for="nome">nome:</label>
                <input type="text" id="nome" placeholder="batata">
                </div>
                 
                <div>
                <label for="email">email:</label>
                <input type="email" id="email">
                </div>
 
                <div>
                <label for="senha">senha:</label>
                <input type="password" id="senha">
                </div>
 
                <div>
                <label for="mensagem">mensagem:</label>
                <textarea id="mensagem" placeholder="mensagem"></textarea>
                </div>
 
                <div>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" min="10" max="20">
                </div>
 
                <div>
                    <label for="cor">cor</label>
                    <input type="color" id="cor">
                </div>
 
                <div>
                    <label for="anexo">Anexo</label>
                    <input type="file" id="anexo">
                </div>
 
                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
            </form>
         </section>
 
    </main>
 
     <!-- Rodape -->
   <footer id="rodape">
    <p>
       &copy; Todos os direitos reservados
    </p>
 
   </footer>
   <script src="./scripts/exemplo.js"></script>
 
</body>
</html>
